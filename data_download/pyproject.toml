[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-storage"
version = "0.1.0"
description = "Audio dataset download utilities and scripts for dataset_storage"
requires-python = ">=3.10,<3.12"
dependencies = [
    "huggingface_hub[cli,hf_transfer]",
    "datasets",
    "requests",
    "tqdm",
    "pandas",
    "pyarrow",
    "gitpython",
    "yt-dlp",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audio_dataset_download*"]

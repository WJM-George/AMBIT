
[DEFAULTS]

#name of the run
name = stable_audio_tools

# name of the project
project = None

# the batch size
batch_size = 4

# If `true`, attempts to resume training from latest checkpoint.
# In this case, each run must have unique config filename.
recover = false

# Save top K model checkpoints during training.
save_top_k = -1

# Optional explicit checkpoint directory. This keeps resumable checkpoints out
# of logger-specific run-id subdirectories.
checkpoint_dir = ''

# W&B runtime directory (use a large training volume).
wandb_dir = ''

# Temporary/compiler-file directory (use a large training volume).
temp_dir = ''

# Minimum free space required in each configured runtime directory.
min_free_disk_gib = 5.0

# number of nodes to use for training
num_nodes = 1

# number of GPUs to use on this node (train.py uses it to pick the DDP strategy)
num_gpus = 1

# Multi-GPU strategy for PyTorch Lightning
strategy = "auto"

# Static-DDP tuning used when --strategy ddp_static is selected.
ddp_bucket_cap_mb = 150
ddp_timeout_min = 10

# Optional single-node locality and gradient-communication tuning. Keep these
# disabled for baseline compatibility; benchmark them before a new run.
bind_to_gpu_numa = False
ddp_comm_hook = "none"

# Precision to use for training
precision = "16-mixed"

# number of CPU workers for the DataLoader
num_workers = 6

# the random seed
seed = 42

# Give each DDP rank an independent noise/dropout/Sobol stream after setup.
# This is an integer because prefigure discards true boolean defaults.
rank_aware_training_seed = 1

# Batches for gradient accumulation
accum_batches = 1

# Number of steps between checkpoints
checkpoint_every = 10000

# Number of steps between validation runs
val_every = -1

# Optional bounded validation/overfit gates.  Negative/zero defaults preserve
# the historical full-loader behavior and disable overfit mode respectively.
limit_val_batches = -1
overfit_batches = 0

# trainer checkpoint file to restart training from
ckpt_path = ''

# model checkpoint file to start a new training run from
pretrained_ckpt_path = ''

# Route-aware weights-only warm start source. Formal pilots use the selected
# online BATF arm and deliberately reset optimizer/scheduler/EMA state.
pretrained_route_weights = "ema"

# Optional narrow second warm-start. This imports only the named modality
# projections/position interface (for example spatial_traj) and leaves the
# primary route's Transformer and planner weights untouched.
pretrained_modality_ckpt_path = ''
pretrained_modality_ids = ''
pretrained_modality_route_weights = "ema"

# Checkpoint path for the pretransform model if needed
pretransform_ckpt_path = ''

# configuration model specifying model hyperparameters
model_config = ''

# configuration for datasets
dataset_config = ''

# configuration for validation datasets
val_dataset_config = ''

# directory to save the checkpoints in
save_dir = ''

# gradient_clip_val passed into PyTorch Lightning Trainer
gradient_clip_val = 0.0

# remove the weight norm from the pretransform model
remove_pretransform_weight_norm = ''

# Logger type to use
logger = 'wandb'

# Maximum training steps (effectively unlimited unless overridden via --max-steps)
max_steps = 10000000000

# Print a machine-readable full-step throughput/memory result at fit end.
benchmark = False
benchmark_warmup_batches = 1

# Fail-closed optimizer/gradient/objective/EMA checks for short training gates.
training_gate = False
training_gate_window = 20
training_gate_max_loss_ratio = -1.0
training_gate_gradient_every = 1

# Accept --pre-encoded for CLI compatibility. NOTE: the effective switch for
# training on pre-encoded latents is the model config (training.pre_encoded=true)
# plus the dataset config (dataset_type=pre_encoded); train.py does not read this flag.
pre_encoded = False

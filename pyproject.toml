[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ambit-audio"
version = "0.1.0"
description = "Inference code for AMBIT spatial audio generation and editing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "torch==2.7.1", "einops==0.8.2", "alias-free-torch==0.0.6",
  "numpy>=1.23.5,<3", "soundfile==0.13.1", "safetensors==0.7.0",
  "transformers==5.3.0", "sentencepiece>=0.1.99,<0.3",
]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "build>=1,<2"]

[project.scripts]
ambit = "ambit.infer:main"

[tool.setuptools.packages.find]
include = ["ambit*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
